<script>
/* ============ SUN & TIME OF DAY ============ */
const LAT=41.56,LON=41.57,RAD=Math.PI/180;
function sunPos(date){
 const d=date.getTime()/86400000+2440587.5-2451545.0;
 const g=(357.529+0.98560028*d)*RAD,q=280.459+0.98564736*d;
 const L=(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD,e=(23.439-0.00000036*d)*RAD;
 const ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L)),dec=Math.asin(Math.sin(e)*Math.sin(L));
 const gmst=(18.697374558+24.06570982441908*d)%24;
 const H=((gmst*15+LON)*RAD-ra);
 const la=LAT*RAD;
 const alt=Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(H));
 const az=Math.atan2(-Math.sin(H),Math.tan(dec)*Math.cos(la)-Math.sin(la)*Math.cos(H));
 return {alt:alt/RAD,az:((az/RAD)+360)%360};
}
function gonioMinutesNow(){const n=new Date();return ((n.getUTCHours()+4)%24)*60+n.getUTCMinutes();}
function dateAtGonioMin(m){const n=new Date();const base=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate());return new Date(base+(m-240)*60000);}
function sunTimes(){let rise=null,set=null,prev=sunPos(dateAtGonioMin(0)).alt;for(let m=5;m<1440;m+=5){const a=sunPos(dateAtGonioMin(m)).alt;if(prev<-0.83&&a>=-0.83&&rise===null)rise=m;if(prev>=-0.83&&a<-0.83)set=m;prev=a;}return {rise:rise??360,set:set??1080};}
const hm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(Math.round(m%60)).padStart(2,'0');
const TOD={live:true,min:gonioMinutesNow(),theme:LS.get('gonio_theme')||'auto',st:sunTimes(),listeners:[]};
function phaseOf(alt,min){
 const pm=min>=780;
 if(alt<-6)return 'night'; if(alt<0.5)return pm?'dusk':'dawn'; if(alt<10)return pm?'sunset':'morning';
 if(min>=660&&min<900)return 'noon'; return pm?'day':'morning';
}
function applyTod(){
 const d=dateAtGonioMin(TOD.min),s=sunPos(d),alt=s.alt,ph=phaseOf(alt,TOD.min);
 TOD.alt=alt;TOD.az=s.az;TOD.phase=ph;
 // theme
 const dark=TOD.theme==='dark'||(TOD.theme==='auto'&&alt<-4);
 document.documentElement.dataset.theme=dark?'dark':'light';
 $('#themeBtn').innerHTML=TOD.theme==='auto'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>':dark?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
 // hero grade
 const day=Math.min(1,Math.max(0,(alt+8)/28)), gold=Math.exp(-Math.pow((alt-3)/6.5,2)), night=1-Math.min(1,Math.max(0,(alt+10)/12));
 const flt=`brightness(${(0.32+0.68*day).toFixed(3)}) saturate(${(0.55+0.45*day+0.2*gold).toFixed(3)}) sepia(${(0.32*gold).toFixed(3)}) hue-rotate(${(-8*gold+12*night).toFixed(1)}deg) contrast(${(1+0.06*gold).toFixed(3)})`;
 $('#heroImg').style.filter=flt;$('#heroFg').style.filter=flt;const rvi=$('#rvImg');if(rvi)rvi.style.filter=flt;
 $('#tint').style.background=`linear-gradient(180deg,rgba(14,26,58,${(0.62*night).toFixed(3)}) 0%,rgba(20,40,70,${(0.42*night).toFixed(3)}) 60%,rgba(255,140,60,${(0.16*gold).toFixed(3)}) 100%)`;
 const fr=(TOD.min-TOD.st.rise)/(TOD.st.set-TOD.st.rise); // 0 sunrise -> 1 sunset
 const sx=86-74*Math.min(1.1,Math.max(-0.1,fr)), sy=Math.max(8,66-Math.max(-8,alt)*1.3);
 const sun=$('#sun');sun.style.left=sx+'%';sun.style.top=sy+'%';sun.style.opacity=alt>-3?Math.min(1,(alt+3)/4):0;
 $('#glow').style.background=`radial-gradient(60% 50% at ${sx}% ${Math.max(sy,30)}%,rgba(255,170,90,${(0.42*gold).toFixed(3)}),transparent 70%)`;
 $('#glow').style.mixBlendMode='soft-light';
 const mfr=((TOD.min-TOD.st.set+1440)%1440)/((TOD.st.rise-TOD.st.set+1440)%1440);
 const moon=$('#moon');moon.style.left=(84-70*mfr)+'%';moon.style.top=(60-44*Math.sin(Math.PI*mfr))+'%';moon.style.opacity=night>0.5?(night-0.5)*2:0;
 $('#stars').style.opacity=night.toFixed(2);
 // texts
 const tm=hm(TOD.min);
 $('#todTxt').textContent=({ka:'გონიო ',en:'Gonio ',ru:'Гонио '})[LANG]+tm;
 $('#heroTime').textContent=tm;$('#heroPhase').textContent=t('ph_'+ph)+(TOD.live?'':' · ◷');
 $('#todBig').textContent=tm;$('#todPhase').textContent=capT('ph_'+ph);
 $('#todRange').value=TOD.min;
 // icon dot
 const ang=Math.PI*(1-Math.min(1,Math.max(0,fr)));const dot=$('#todDot');
 dot.setAttribute('cx',(22+18*Math.cos(ang)).toFixed(1));dot.setAttribute('cy',(24-18*Math.sin(ang)*(alt>0?1:-0.2)).toFixed(1));dot.setAttribute('fill',alt>0?'#E08A2B':'#B9B3A6');
 const a2=Math.PI*(1-Math.min(1.05,Math.max(-0.05,fr)));const as=$('#arcSun');
 as.setAttribute('cx',(160+140*Math.cos(a2)).toFixed(1));as.setAttribute('cy',(104-140*Math.sin(a2)*0.62).toFixed(1));as.setAttribute('fill',alt>0?'#E08A2B':'#8F9A8E');
 $('#arcRise').textContent=t('rise')+' '+hm(TOD.st.rise);$('#arcSet').textContent=t('set')+' '+hm(TOD.st.set);
 $$('#todPresets button').forEach(b=>b.classList.toggle('on',b.dataset.p==='live'&&TOD.live));
 $$('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t===TOD.theme));
 TOD.listeners.forEach(f=>f(TOD));
}
setInterval(()=>{if(TOD.live){TOD.min=gonioMinutesNow();applyTod();}},30000);
</script>

 else if(calc.plan==='B'){segs=[[SET.downPct,'var(--man)'],[100-SET.downPct,'var(--euc)']];lbl=[t('tlNow')+' · '+SET.downPct+'%',`${SET.months} × ${(((100-SET.downPct)/SET.months)).toFixed(1)}%`,`+${SET.months} ${t('mo')}`];}
 else {segs=[[100,'var(--man)']];lbl=[t('tlNow')+' · 100%','',''];}
 $('#cTl').innerHTML=`<div class="bar">${segs.map(s=>`<i style="flex:${s[0]};background:${s[1]}"></i>`).join('')}</div><div class="lbls">${lbl.map(l=>`<span>${l}</span>`).join('')}</div>`;
}

/* ---- lead ---- */
let leadCtx='calc';
function bindLead(root){$$('[data-lead]',root).forEach(b=>b.onclick=()=>openLead(b.dataset.lead));}
function openLead(ctx){lpush('lead');leadCtx=ctx;$('#leadM').classList.add('open');setTimeout(()=>$('#lName').focus(),60);}
CLOSERS.lead=()=>$('#leadM').classList.remove('open');
function closeLead(){if($('#leadM').classList.contains('open'))lclose('lead',CLOSERS.lead);}
$('#leadM').onclick=e=>{if(e.target.id==='leadM'||e.target.closest('[data-close]'))closeLead();};
const validPhone=p=>p.replace(/\D/g,'').length>=9;
async function saveLead(data){
 if(!SHEET_URL)return false;
 try{const r=await fetch(SHEET_URL,{method:'POST',body:JSON.stringify({...data,lang:LANG,page:location.href})});const j=await r.json();
  if(j&&j.prices){Object.entries(j.prices).forEach(([id,v])=>{const u=U(id);if(u&&typeof v==='number')u.price=v;});try{localStorage.setItem('gonio_prices',JSON.stringify(j.prices))}catch(e){}renderAll();}
  return true;}catch(e){console.warn('lead',e);return false;}
}
$('#leadF').onsubmit=async e=>{e.preventDefault();const ph=$('#lPhone').value.trim();if(!validPhone(ph)){$('#lErr').classList.add('show');return;}$('#lErr').classList.remove('show');
 UNLOCK=true;SS.set('gonio_lead','1');LS.set('gonio_lead','1');px('Lead',{content_name:'price_unlock',content_category:leadCtx});
 const bt=$('#leadF button[type=submit]');bt.disabled=true;await saveLead({name:$('#lName').value.trim(),phone:ph,ctx:leadCtx,unit:curUnit?.id||calc.unit,plan:calc.plan});bt.disabled=false;
 closeLead();toast(t('unlocked'));renderCalc();if($('#drawer').classList.contains('open'))renderDrawer();
 if(leadCtx==='schedule')window.open(waLink('schedule'),'_blank','noopener');
};
$('#cForm').onsubmit=async e=>{e.preventDefault();const ph=$('#fPhone').value.trim();if(!validPhone(ph)){$('#fErr').classList.add('show');return;}$('#fErr').classList.remove('show');
 px('Lead',{content_name:'contact_form',content_category:$('#fTopic').value});await saveLead({name:$('#fName').value.trim(),phone:ph,ctx:'contact',topic:$('#fTopic').value,msg:$('#fMsg').value.trim(),unit:calc.unit});
 UNLOCK=true;SS.set('gonio_lead','1');LS.set('gonio_lead','1');renderCalc();
 const a=$('#fOk a');a.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(t('waGen')+' '+($('#fName').value.trim()?'('+$('#fName').value.trim()+') ':'')+$('#fMsg').value.trim());
 $('#fOk').classList.add('show');};
bindLead(document);

/* ---- phone copy ---- */
document.addEventListener('click',e=>{const a=e.target.closest('a[href*="wa.me"]');if(a)px('Contact',{content_name:'WhatsApp',content_category:a.dataset.wa||'unit'});},true);
$('#copyPhone').onclick=async()=>{const v='+995 591 29 44 88';try{await navigator.clipboard.writeText(v);toast(t('copied'));}catch(e){const r=document.createRange();r.selectNodeContents($('#phone'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast(v);}};

/* ---- faq ---- */
function renderFaq(){$('#faqList').innerHTML=[1,2,3,4,5,6].map(i=>`<details><summary>${t('q'+i)}<i></i></summary><p>${t('a'+i)}</p></details>`).join('');}

/* ---- gallery ---- */
let galAll=false,lbList=[],lbI=0;const GAL_N=6;
function renderGallery(){const list=galAll?GAL:GAL.slice(0,GAL_N);$('#gal').innerHTML=list.map((g,i)=>`<button data-k="${i}"><img src="a/${g}.webp" alt="" loading="lazy"></button>`).join('');
 $$('#gal button').forEach(b=>b.onclick=()=>openLb(GAL,+b.dataset.k));
 $('#galMore').textContent=galAll?t('galLess'):`${t('galMore')} (${GAL.length-GAL_N})`;}
$('#galMore').onclick=()=>{galAll=!galAll;renderGallery();if(!galAll)$('#gallery').scrollIntoView({behavior:'smooth'});};
function openLb(list,i){lpush('lb');lbList=list;lbI=i;showLb();$('#lb').classList.add('open');}
function showLb(){$('#lbImg').src='a/'+lbList[lbI]+'.webp';$('#lbC').textContent=(lbI+1)+' / '+lbList.length;}
CLOSERS.lb=()=>$('#lb').classList.remove('open');
function closeLb(){if($('#lb').classList.contains('open'))lclose('lb',CLOSERS.lb);}
$('#lb').onclick=e=>{const b=e.target.closest('[data-lb]');if(!b){if(e.target.id==='lb')closeLb();return;}const k=b.dataset.lb;if(k==='x')closeLb();else{lbI=(lbI+(k==='n'?1:-1)+lbList.length)%lbList.length;showLb();}};
addEventListener('keydown',e=>{if(!$('#lb').classList.contains('open'))return;if(e.key==='ArrowRight'){lbI=(lbI+1)%lbList.length;showLb();}if(e.key==='ArrowLeft'){lbI=(lbI-1+lbList.length)%lbList.length;showLb();}});

/* expose for module */
window.V3={};window.UNITS=UNITS;window.t=t;window.TOD=TOD;window.selectFloor=selectFloor;

<script>
/* ============ GOOGLE SHEETS ============ */
(async()=>{
 try{const cp=JSON.parse(localStorage.getItem('gonio_prices')||'null');if(cp&&UNLOCK)Object.entries(cp).forEach(([id,v])=>{const u=U(id);if(u)u.price=v;});}catch(e){}
 if(!SHEET_URL){renderAll();return;}
 try{const r=await fetch(SHEET_URL+'?a=state');const j=await r.json();
  (j.units||[]).forEach(x=>{const u=U(x.id);if(u&&x.status)u.status=x.status;});
  if(j.settings)Object.entries(j.settings).forEach(([k,v])=>{if(k in SET)SET[k]=(k==='offerOn')?(v===true||v==='TRUE'||v===1||v==='1'):+v;});
  renderAll();}catch(e){console.warn('state',e);}
})();
</script>
